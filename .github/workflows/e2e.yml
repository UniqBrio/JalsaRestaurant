name: e2e

# Manual only, deliberately.
#
# This suite boots two real Next.js instances and drives seven browser projects across three
# engines, so it is minutes, not seconds. Hung off every push it would be the check people learn
# to ignore; run on demand it is the check people read.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: jalsa

    env:
      # --- Environment identity ---------------------------------------------
      # Deliberately independent of NODE_ENV: a staging deploy is a PRODUCTION BUILD pointed at
      # NON-PRODUCTION DATA, and conflating the two is how a test run reaches live customers.
      APP_ENV: test

      # OFF, and never anything else in CI. The worst case of a wrong default here is a real
      # message to a real guest from a test run.
      ALLOW_OUTBOUND_MESSAGES: 'false'

      # --- The application under test ---------------------------------------
      PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3000/api
      PUBLIC_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_QR_ORIGIN: http://localhost:3000

      # --- Secrets ----------------------------------------------------------
      # SESSION_SECRET signs the staff PIN cookie.
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      # DATABASE_URL is carried through because it was asked for, but NOTHING IN THIS
      # APPLICATION READS IT — `grep -rn DATABASE_URL jalsa/src` returns nothing. The database is
      # reached through Supabase's REST API, so the variables that actually configure it are the
      # three below. Setting DATABASE_URL alone makes `requireAll()` in src/lib/config.ts throw at
      # import time, every route renders NotConfiguredState, and the suite spends its whole run
      # asserting against a misconfigured application — green where it matters least.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Bypasses row-level security. Server-only: never given a NEXT_PUBLIC_ prefix, never logged.
      #
      # THESE THREE MUST POINT AT THE DEDICATED TEST PROJECT, NEVER THE SEEDED DEVELOPMENT ONE.
      # The suite writes real rows (guest journey) and the reset step deletes them. The reset
      # refuses the development project by ref as a last line of defence - but the secrets are
      # the first, and they are set by a person.
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jalsa/package-lock.json

      # Fail in ten seconds with a list, rather than in twenty minutes with a green report over a
      # misconfigured application. This mirrors what src/lib/config.ts does at process start;
      # doing it here means the failure names the missing SECRET rather than the missing variable.
      - name: Check the required secrets are present
        run: |
          missing=()
          for v in SESSION_SECRET NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "See jalsa/docs/registers/ENVIRONMENTS.md for what each one is."
            exit 1
          fi
          [ -n "$DATABASE_URL" ] || echo "::notice::DATABASE_URL is unset. Nothing in this application reads it."

      - name: Install dependencies
        run: npm ci

      # KL-3 in jalsa/docs/registers/KNOWN_LIMITATIONS.md: the build container that wrote this
      # suite supplied Chromium only, so playwright.config.ts drops the two WebKit-backed
      # projects (tablet, mobile-ios) whenever PLAYWRIGHT_CHROMIUM_PATH is set. Here both engines
      # are installed properly and that variable is never set, so all seven projects run.
      - name: Install browsers (Chromium and WebKit)
        run: npx playwright install --with-deps chromium webkit

      # The drop in playwright.config.ts is conditional, and a conditional that silently applies
      # is how KL-3 would quietly persist into CI. This fails if anything ever sets the override.
      - name: Assert the WebKit projects are not being dropped
        run: |
          if [ -n "${PLAYWRIGHT_CHROMIUM_PATH:-}" ]; then
            echo "::error::PLAYWRIGHT_CHROMIUM_PATH is set, so playwright.config.ts drops tablet and mobile-ios."
            echo "Safari-engine coverage would not run. Unset it — this job installs WebKit itself."
            exit 1
          fi
          npx playwright test --list --reporter=list 2>/dev/null | grep -q '\[tablet\]' \
            || { echo "::error::No [tablet] project in the run. WebKit coverage is missing."; exit 1; }
          npx playwright test --list --reporter=list 2>/dev/null | grep -q '\[mobile-ios\]' \
            || { echo "::error::No [mobile-ios] project in the run. WebKit coverage is missing."; exit 1; }

      # No separate dev-server step: jalsa/playwright.config.ts owns a webServer block. It starts
      # BOTH instances — the application under test on :3000, and a second one on :3101 pointed at
      # an address that refuses instantly, which is how the outage screens are asserted against a
      # real server render rather than a mock. Starting a server here as well would collide with
      # the first and leave the second unstarted.
      # The guest journey WRITES (a session, a bill, KOTs, a tip) and needs a known starting
      # state, because "one open bill per table" means run 2 would land on run 1's bill. So the
      # TEST project is put back to its seed first. The script refuses the development /
      # production project by ref, refuses without APP_ENV=test, and refuses without this
      # explicit flag - so the same secrets pointed at the wrong project make it exit 2 having
      # deleted nothing, and the suite does not run.
      - name: Reset the test database to its seed
        env:
          RESET_TEST_DB: 'yes'
        run: npm run --silent test:reset

      - name: Run the suite
        run: npx playwright test

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: jalsa/playwright-report
          retention-days: 14
