# CI — runs exactly the same gate developers run locally.
#
# If CI and local run different checks, one of them is decoration — and it is always the one
# that is slower to fix.
#
# Copy to .github/workflows/ci.yml

name: CI

on:
  push: { branches: [main, dev] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchets and the fail-first guard both need history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `ci`, never `install`. A CI run that resolves different versions than the lockfile is
      # not testing what will ship.
      - run: npm ci

      # ---- Cheap, always-runnable gates first -------------------------------------------
      # These need no browser and no credentials, so they run in every environment and
      # therefore always actually run.
      #
      # ONE STEP, NOT A LIST OF THEM - and that is the point.
      #   This block used to enumerate the audits by name, which made it a hand-maintained COPY
      #   of the `audit:all` script. It drifted, exactly as a copy does: `audit:fixtures` and
      #   `audit:deadweight` were added to `audit:all` and never added here, so two of the ten
      #   audits could not fail a pull request. The header of this file says CI and local must
      #   run the same checks or one of them is decoration, and the decorated one was this.
      #
      #   Calling the script instead of restating it removes the drift STRUCTURALLY rather than
      #   adding a rule telling someone to keep two lists in step. A new audit is wired into CI
      #   by the same edit that adds it to `audit:all`, and there is no second place to forget.
      #
      #   `par.mjs` labels every task and runs them ALL, so a failure here still names each
      #   check individually - and it names every failing one, not just the first.

      - name: Every audit (theme, contrast, assets, colours, test ids, rules, columns, fixtures, dead weight, compat)
        run: npm run audit:all

      - name: Commit guards are reachable (incl. upgrade/lineage suite)
        run: npm run guard:test

      # ---- Application gates --------------------------------------------------------------
      # The application's dependencies are separate from the framework's. Without this step
      # every gate below fails on a missing toolchain, not on the code - and `npx tsc` with no
      # local TypeScript would fetch an unrelated registry package of that name and run it.
      # The starter ships deliberately unpinned (a shape, not a lockfile), hence `install`;
      # in a scaffolded app, commit the lockfile and change this to `npm ci`.
      - name: Install application dependencies
        working-directory: starter
        run: npm install

      - name: Types
        working-directory: starter
        run: npm run typecheck

      - name: Lint
        working-directory: starter
        run: npm run lint

      - name: Unit + pure specs
        working-directory: starter
        run: npm run test:unit

      - name: Install browsers
        working-directory: starter
        run: npx playwright install --with-deps chromium

      - name: Render + functional
        working-directory: starter
        run: npm run test:functional

      # Uploaded on failure only. A green run does not need 200MB of traces.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: starter/playwright-report/
          retention-days: 14

  # ---- The framework's own self-tests, on a SECOND path namespace ----------------------
  # RC-012: three guard suites reported twelve failing assertions about code that was
  # entirely correct. A path used as argv is translated by the shell on the way out; the same
  # string interpolated into JavaScript SOURCE is data, nothing translates it, and Git Bash's
  # /c/Explorations/... reached Node as C:\c\Explorations\.... On Linux the shell's path
  # namespace and the interpreter's agree, so the whole class is invisible to the job above -
  # which would have stayed green through every one of those twelve, forever.
  #
  # This job is deliberately NOT a mirror of `gate`. It installs no browsers and runs no
  # application gate: those exercise the APP's toolchain, which is not where this class lives,
  # and duplicating them would roughly double the bill to re-prove what ubuntu already proved.
  # It runs only the part that is platform-sensitive - the framework's own checks - so the
  # cost is a few minutes and the coverage is the hole RC-012 came through.
  self-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    # The suites ARE bash scripts. pwsh is the runner's default and cannot run them, and a
    # step that cannot run is the failure mode this whole job exists to catch.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as the gate job: the ratchets and the fail-first guard read history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Every audit (the same script the gate job runs - never a second list)
        run: npm run audit:all

      - name: Commit guards are reachable, on this path namespace
        run: npm run guard:test
